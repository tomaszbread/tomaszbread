<div class="wrapper">
  <div class="logo-section">
    <div class="site-logo">
      <span class="logo-word logo-word-tomasz">tomasz</span>
      <span class="logo-word logo-word-chlebek">chlebek</span>
      <span class="logo-word logo-word-dev">.dev</span>
    </div>
    <ul class="menu">
      <li [routerLink]="'/bio'" [skipLocationChange]="true">Bio</li>
      <li [routerLink]="'/pro'" [skipLocationChange]="true">Projects</li>
      <li [routerLink]="'/cv'" [skipLocationChange]="true">CV</li>
    </ul>
    <div
      class="inner-section logo-section bread"
      *ngIf="appservice.hideAvatar"
    ></div>
  </div>
  <section class="main-section">
    <div class="partial">
      <div
        class="inner-section content-section"
        [style.width]="appservice.hideAvatar == true ? '100%' : ''"
      >
        <router-outlet style="display: none"></router-outlet>
      </div>
    </div>
  </section>
  <div class="social">
    <app-social-media></app-social-media>
  </div>
</div>
